# Run the whole system:   docker compose up --build
#   API  ->  http://localhost:8000/docs
#   UI   ->  http://localhost:8501
#
# Needs a .env file next to this one with OPENAI_API_KEY and ADMIN_API_KEY (see .env.example).

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - app-data:/data # search index, database and conversation state persist across restarts
    restart: unless-stopped

  ui:
    build:
      context: .
      args:
        UV_EXTRAS: "--extra ui"
    command: ["streamlit", "run", "/app/.venv/lib/python3.12/site-packages/isaac_says/ui/streamlit_app.py",
              "--server.port=8501", "--server.address=0.0.0.0", "--browser.gatherUsageStats=false"]
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000 # containers reach each other by service name
    healthcheck:
      # Overrides the image healthcheck, which probes the API port (not served by this container).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
