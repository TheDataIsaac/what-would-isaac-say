[project]
name = "what-would-isaac-say"
version = "0.1.0"
description = "A grounded AI assistant that answers from, and reviews work against, the Explain the Data newsletter."
readme = "README.md"
authors = [{ name = "Isaac Oresanya" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "openai>=1.0",
    "rich>=13",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    # Pinned to one major version: MCP 2.0 renamed FastMCP to MCPServer and changed other APIs.
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
# The Streamlit UI is optional so the API container stays small.
ui = ["streamlit>=1.40"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[project.scripts]
isaac-says = "isaac_says.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "isaac_says"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import order, UP = modern syntax, B = likely bugs,
# SIM = simplifications, ASYNC = async mistakes.
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# The formatter wraps code. E501 would only flag long strings and comments it cannot wrap.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() and Query() in argument defaults are the framework's intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.security.APIKeyHeader"]
